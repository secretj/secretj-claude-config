<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" width="880" height="492" role="img" aria-label="두 설정 저장소가 ~/.claude 를 디렉토리 단위로 나눠 쓰는 구조. commands 는 사내 저장소, agents·skills·rules·hooks·templates·CLAUDE.md·settings.json 은 이 저장소가 정본이다.">
  <title>~/.claude 의 소유권을 디렉토리 단위로 나눈다</title>
  <desc>같은 머신에 설정 저장소가 둘 있다. commands/ 는 사내 저장소가 정본이고, agents/ skills/ rules/ hooks/ templates/ CLAUDE.md settings.json 은 이 저장소가 정본이다. 겹치는 자리는 agents/ 와 settings.json 둘뿐이다.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --line: #d1d9e0;
      --card: #f6f8fa;
      --mine: #0969da;
      --theirs: #6e7781;
      --warn: #bc4c00;
      --warnbg: #fff8f2;
      --chip: #eaeef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --line: #3d444d;
        --card: #151b23;
        --mine: #4493f8;
        --theirs: #8b949e;
        --warn: #db6d28;
        --warnbg: #2d1a0c;
        --chip: #212830;
      }
    }
    .bg { fill: var(--bg); }
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 21px; font-weight: 700; fill: var(--fg); }
    .sub { font-size: 13px; fill: var(--muted); }
    .boxh { font-size: 14px; font-weight: 700; }
    .boxm { font-size: 11px; fill: var(--muted); }
    .row { font-size: 13px; fill: var(--fg); }
    .rowm { font-size: 11px; fill: var(--muted); }
    .cap { font-size: 12.5px; fill: var(--muted); }
    .capb { font-size: 12.5px; fill: var(--fg); font-weight: 700; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .panel { fill: none; stroke: var(--line); stroke-width: 1; }
    .chipt { font-size: 10px; font-weight: 700; }

    .pop { opacity: 0; animation: pop 14s ease-out infinite; }
    @keyframes pop {
      0%, 2%   { opacity: 0; }
      7%, 94%  { opacity: 1; }
      100%     { opacity: 0; }
    }
    /* 저장소 -> ~/.claude 로 흐르는 연결선 */
    .flowMine   { stroke: var(--mine);   stroke-width: 2; stroke-dasharray: 6 8; fill: none;
                  animation: flow 1.4s linear infinite; }
    .flowTheirs { stroke: var(--theirs); stroke-width: 2; stroke-dasharray: 6 8; fill: none;
                  animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    /* 겹치는 자리는 계속 깜빡인다 */
    .clash { stroke: var(--warn); stroke-width: 1.5; fill: var(--warnbg);
             animation: clash 2.6s ease-in-out infinite; }
    @keyframes clash {
      0%, 100% { stroke-opacity: .35; }
      50%      { stroke-opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pop { opacity: 1; animation: none; }
      .flowMine, .flowTheirs, .clash { animation: none; }
    }
  </style>

  <rect class="bg" width="880" height="492" rx="10"/>

  <text class="h1" x="36" y="40">~/.claude 의 소유권을 디렉토리 단위로 나눈다</text>
  <text class="sub" x="36" y="63">같은 머신에 설정 저장소가 둘 있어 같은 자리를 노린다. 겹치는 사본을 양쪽에 두지 않는다.</text>

  <!-- ── 왼쪽: 두 저장소 ── -->
  <g class="pop" style="animation-delay:.1s">
    <rect class="card" x="36" y="104" width="252" height="78" rx="8"/>
    <rect x="36" y="104" width="4" height="78" rx="2" fill="var(--mine)"/>
    <text class="boxh" x="52" y="128" fill="var(--mine)">이 저장소 — 개인</text>
    <text class="boxm" x="52" y="148">secretj-claude-config</text>
    <text class="boxm" x="52" y="166">파일 단위 symlink · 남의 파일과 공존한다</text>
  </g>
  <g class="pop" style="animation-delay:.35s">
    <rect class="card" x="36" y="214" width="252" height="78" rx="8"/>
    <rect x="36" y="214" width="4" height="78" rx="2" fill="var(--theirs)"/>
    <text class="boxh" x="52" y="238" fill="var(--theirs)">사내 설정 저장소</text>
    <text class="boxm" x="52" y="258">범용 워크플로 9개 + 사내 전용 9개</text>
    <text class="boxm" x="52" y="276">디렉토리 단위 symlink · 통째로 덮어쓴다</text>
  </g>

  <!-- 연결선 -->
  <g class="pop" style="animation-delay:.8s">
    <path class="flowMine"   d="M288 143 C 318 143, 318 176, 348 176"/>
    <path class="flowTheirs" d="M288 253 C 318 253, 318 150, 348 150"/>
  </g>

  <!-- ── 오른쪽: ~/.claude ── -->
  <g class="pop" style="animation-delay:1.1s">
    <rect class="panel" x="360" y="104" width="484" height="286" rx="8"/>
    <text class="boxh mono" x="376" y="128" fill="var(--fg)">~/.claude</text>
    <text class="boxm" x="470" y="128">설치 결과. 정본이 어디인지로 나뉜다</text>
  </g>

  <!-- commands — 사내 -->
  <g class="pop" style="animation-delay:1.5s">
    <rect class="card" x="376" y="142" width="452" height="30" rx="6"/>
    <rect x="376" y="142" width="3" height="30" rx="1.5" fill="var(--theirs)"/>
    <text class="row mono" x="392" y="162">commands/</text>
    <text class="rowm" x="520" y="162">이 저장소는 전혀 건드리지 않는다</text>
    <rect fill="var(--chip)" x="742" y="149" width="72" height="17" rx="8"/>
    <text class="chipt" x="752" y="161" fill="var(--theirs)">사내 정본</text>
  </g>

  <!-- agents — 개인, 겹침 -->
  <g class="pop" style="animation-delay:1.75s">
    <rect class="clash" x="376" y="178" width="452" height="30" rx="6"/>
    <rect x="376" y="178" width="3" height="30" rx="1.5" fill="var(--mine)"/>
    <text class="row mono" x="392" y="198">agents/</text>
    <text class="rowm" x="520" y="198">사내 것은 접두사 사본으로 공존</text>
    <rect fill="var(--chip)" x="742" y="185" width="72" height="17" rx="8"/>
    <text class="chipt" x="757" y="197" fill="var(--warn)">겹침</text>
  </g>

  <!-- 개인 단독 -->
  <g class="pop" style="animation-delay:2s">
    <rect class="card" x="376" y="214" width="452" height="30" rx="6"/>
    <rect x="376" y="214" width="3" height="30" rx="1.5" fill="var(--mine)"/>
    <text class="row mono" x="392" y="234">skills/</text>
    <text class="rowm" x="520" y="234">개인 스킬 6개</text>
  </g>
  <g class="pop" style="animation-delay:2.2s">
    <rect class="card" x="376" y="250" width="452" height="30" rx="6"/>
    <rect x="376" y="250" width="3" height="30" rx="1.5" fill="var(--mine)"/>
    <text class="row mono" x="392" y="270">rules/ · hooks/ · templates/</text>
    <text class="rowm" x="652" y="270">사내가 안 건드린다</text>
  </g>
  <g class="pop" style="animation-delay:2.4s">
    <rect class="card" x="376" y="286" width="452" height="30" rx="6"/>
    <rect x="376" y="286" width="3" height="30" rx="1.5" fill="var(--mine)"/>
    <text class="row mono" x="392" y="306">CLAUDE.md</text>
    <text class="rowm" x="520" y="306">symlink · 매 세션 전부 로드</text>
  </g>

  <!-- settings.json — 개인, 겹침 -->
  <g class="pop" style="animation-delay:2.6s">
    <rect class="clash" x="376" y="322" width="452" height="30" rx="6"/>
    <rect x="376" y="322" width="3" height="30" rx="1.5" fill="var(--mine)"/>
    <text class="row mono" x="392" y="342">settings.json</text>
    <text class="rowm" x="520" y="342">키 단위 머지 · 외부 훅 보존</text>
    <rect fill="var(--chip)" x="742" y="329" width="72" height="17" rx="8"/>
    <text class="chipt" x="757" y="341" fill="var(--warn)">겹침</text>
  </g>

  <g class="pop" style="animation-delay:2.9s">
    <text class="rowm" x="376" y="374" fill="var(--warn)">겹치는 자리는 둘뿐이다. 둘 다 이 저장소가 정본이다.</text>
  </g>

  <!-- 캡션 -->
  <line x1="36" y1="412" x2="844" y2="412" stroke="var(--line)" stroke-width="1"/>
  <g class="pop" style="animation-delay:3.3s">
    <text class="cap" x="36" y="436"><tspan class="capb">방향이 비대칭이다.</tspan> 이 저장소의 설치는 사내 설정을 깨지 않는다 — 반대는 깬다.</text>
    <text class="cap" x="36" y="455">사내 installer 가 agents/ 를 디렉토리 symlink 로 덮어써 역할 agent 10개를 가리기 때문이다.</text>
    <text class="cap" x="36" y="474">그래서 agents/ 는 이쪽이 정본이어야 둘 다 산다.</text>
  </g>
</svg>
