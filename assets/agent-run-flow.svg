<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="/agent-run 으로 패널을 열고, 에이전트를 고르고, 작업을 입력하면 에이전트가 백그라운드에서 돈다. 그동안 대화를 계속할 수 있다. 끝나면 결과를 사람이 보는 알림 행과 Claude 가 읽는 전문 행으로 붙인다.">
  <title>agent-run — 에이전트를 골라 작업을 맡긴다</title>
  <desc>다섯 단계: /agent-run 입력, 패널에서 에이전트 선택, 작업 입력 후 Enter, 백그라운드 실행, 결과 두 행 붙이기.</desc>

  <style>
    :root {
      --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --card: #f6f8fa;
      --acc: #8250df; --ok: #1a7f37; --chip: #eaeef2; --term: #24292f; --termfg: #e6edf3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --card: #151b23;
        --acc: #a371f7; --ok: #3fb950; --chip: #212830; --term: #010409; --termfg: #e6edf3;
      }
    }
    .bg { fill: var(--bg); }
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 21px; font-weight: 700; fill: var(--fg); }
    .sub { font-size: 13px; fill: var(--muted); }
    .num { font-size: 13px; font-weight: 700; fill: var(--acc); }
    .st { font-size: 14px; font-weight: 700; fill: var(--fg); }
    .sm { font-size: 11.5px; fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .hi { fill: none; stroke: var(--acc); stroke-width: 2; opacity: 0; }
    .term { fill: var(--term); }
    .tt { font-size: 12.5px; fill: var(--termfg); }
    .tm { font-size: 12.5px; fill: #8b949e; }
    .tok { fill: var(--ok); font-weight: 700; }
    .wire { stroke: var(--line); stroke-width: 2; fill: none; }
    .flow { stroke: var(--acc); stroke-width: 2; fill: none; stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }

    /* 14초 한 바퀴: 카드가 차례로 켜지고, 마지막에 결과 두 행이 붙는다 */
    .s1 { animation: s1 14s infinite; } @keyframes s1 { 0%, 3% { opacity: 0 } 6%, 18% { opacity: 1 } 21%, 100% { opacity: 0 } }
    .s2 { animation: s2 14s infinite; } @keyframes s2 { 0%, 18% { opacity: 0 } 21%, 33% { opacity: 1 } 36%, 100% { opacity: 0 } }
    .s3 { animation: s3 14s infinite; } @keyframes s3 { 0%, 33% { opacity: 0 } 36%, 48% { opacity: 1 } 51%, 100% { opacity: 0 } }
    .s4 { animation: s4 14s infinite; } @keyframes s4 { 0%, 48% { opacity: 0 } 51%, 66% { opacity: 1 } 69%, 100% { opacity: 0 } }
    .s5 { animation: s5 14s infinite; } @keyframes s5 { 0%, 66% { opacity: 0 } 69%, 95% { opacity: 1 } 100% { opacity: 0 } }
    .out1 { opacity: 0; animation: out1 14s infinite; } @keyframes out1 { 0%, 68% { opacity: 0 } 72%, 95% { opacity: 1 } 100% { opacity: 0 } }
    .out2 { opacity: 0; animation: out2 14s infinite; } @keyframes out2 { 0%, 72% { opacity: 0 } 76%, 95% { opacity: 1 } 100% { opacity: 0 } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .keep { opacity: 0; animation: keep 14s infinite; } @keyframes keep { 0%, 50% { opacity: 0 } 54%, 66% { opacity: 1 } 69%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .spin, .s1, .s2, .s3, .s4, .s5, .keep { animation: none; }
      .out1, .out2 { animation: none; opacity: 1; }
    }
  </style>

  <rect class="bg" width="880" height="380" rx="12"/>
  <text class="h1" x="32" y="44">agent-run — 에이전트를 골라 작업을 맡긴다</text>
  <text class="sub" x="32" y="68">에이전트는 백그라운드에서 돈다. 그동안 대화를 계속하고, 끝나면 결과가 대화에 붙는다.</text>

  <!-- 연결선 -->
  <path class="wire" d="M182 140 H 700"/>
  <path class="flow" d="M182 140 H 700"/>

  <!-- 카드 다섯 개: 폭 152, 간격 14 -->
  <g>
    <rect class="card" x="32" y="96" width="152" height="88" rx="10"/>
    <rect class="hi s1" x="32" y="96" width="152" height="88" rx="10"/>
    <text class="num" x="46" y="118">1</text>
    <text class="st mono" x="46" y="146">/agent-run</text>
    <text class="sm" x="46" y="168">패널을 연다</text>
  </g>
  <g>
    <rect class="card" x="198" y="96" width="152" height="88" rx="10"/>
    <rect class="hi s2" x="198" y="96" width="152" height="88" rx="10"/>
    <text class="num" x="212" y="118">2</text>
    <text class="st" x="212" y="146">에이전트 고르기</text>
    <text class="sm" x="212" y="168">↑↓ 로 고르고 Enter</text>
  </g>
  <g>
    <rect class="card" x="364" y="96" width="152" height="88" rx="10"/>
    <rect class="hi s3" x="364" y="96" width="152" height="88" rx="10"/>
    <text class="num" x="378" y="118">3</text>
    <text class="st" x="378" y="146">작업 입력</text>
    <text class="sm" x="378" y="168">Enter 로 맡긴다</text>
  </g>
  <g>
    <rect class="card" x="530" y="96" width="152" height="88" rx="10"/>
    <rect class="hi s4" x="530" y="96" width="152" height="88" rx="10"/>
    <text class="num" x="544" y="118">4</text>
    <text class="st" x="544" y="146">백그라운드 실행</text>
    <circle class="spin" cx="662" cy="114" r="6" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="20 18"/>
    <text class="sm" x="544" y="168">시작 토스트 · 대화 계속</text>
  </g>
  <g>
    <rect class="card" x="696" y="96" width="152" height="88" rx="10"/>
    <rect class="hi s5" x="696" y="96" width="152" height="88" rx="10"/>
    <text class="num" x="710" y="118">5</text>
    <text class="st" x="710" y="146">결과를 붙인다</text>
    <text class="sm" x="710" y="168">완료 토스트 · ✓ 기록</text>
  </g>

  <!-- 백그라운드 도는 동안 -->
  <g class="keep">
    <rect class="term" x="32" y="208" width="816" height="34" rx="8"/>
    <text class="tt mono" x="48" y="230">❯ 그동안 다른 질문을 계속한다 …</text>
  </g>

  <!-- 결과 두 행 -->
  <g class="out1">
    <rect class="term" x="32" y="208" width="816" height="56" rx="8"/>
    <text class="tm mono" x="48" y="230">알림 행 · 사람이 본다 · 앞 1,500자</text>
    <text class="tt mono" x="48" y="252">[agent-run] codebase-locator — hooks 폴더의 셸 스크립트 목록만 찾아줘</text>
  </g>
  <g class="out2">
    <rect class="term" x="32" y="274" width="816" height="56" rx="8" style="opacity:.85"/>
    <text class="tm mono" x="48" y="296">전문 행 · Claude 가 읽는다 · 화면에 안 보임</text>
    <text class="tt mono" x="48" y="318">결과 전문: hooks/gate-git-write.sh, hooks/statusline.sh …  <tspan class="tok">→ 다음 질문부터 Claude 가 안다</tspan></text>
  </g>
  <text class="sm" x="32" y="358">최근 맡긴 일 5개는 패널 아래에 ⏳ 실행 중 · ✓ 완료 · ✗ 실패로 남는다.</text>
</svg>
