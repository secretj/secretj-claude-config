<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" role="img" aria-label="로드 시점으로 레이어를 나눈 구조: 매 세션 전부 로드되는 것, 이름을 부를 때만 로드되는 것, 그 에이전트가 돌 때만 로드되는 것">
  <title>로드 시점으로 레이어를 나눈다</title>
  <desc>매 세션 전부 로드: CLAUDE.md 40줄, agent description 3,547자, rules 1개, memory 19개, MCP 도구 이름. 이름을 부를 때만: skills 6개. 그 에이전트가 돌 때만: agent 본문 16개.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --line: #d1d9e0;
      --card: #f6f8fa;
      --always: #0969da;
      --ondemand: #8250df;
      --lazy: #1a7f37;
      --chip: #eaeef2;
      --warn: #bc4c00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --line: #3d444d;
        --card: #151b23;
        --always: #4493f8;
        --ondemand: #ab7df8;
        --lazy: #3fb950;
        --chip: #212830;
        --warn: #db6d28;
      }
    }
    .bg { fill: var(--bg); }
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", "Noto Sans KR", sans-serif; }
    .h1 { font-size: 21px; font-weight: 700; fill: var(--fg); }
    .sub { font-size: 13px; fill: var(--muted); }
    .colh { font-size: 14px; font-weight: 700; }
    .colm { font-size: 11px; fill: var(--muted); }
    .item { font-size: 13px; fill: var(--fg); }
    .meta { font-size: 11px; fill: var(--muted); }
    .cap { font-size: 12.5px; fill: var(--muted); }
    .capb { font-size: 12.5px; fill: var(--fg); font-weight: 700; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1; }
    .chip { fill: var(--chip); }
    .chipt { font-size: 10px; fill: var(--muted); font-weight: 700; }

    /* 항목이 자기 로드 시점에 나타난다 */
    .pop { opacity: 0; animation: pop 13s ease-out infinite; }
    @keyframes pop {
      0%, 3%   { opacity: 0; }
      9%, 93%  { opacity: 1; }
      100%     { opacity: 0; }
    }
    /* 세션 시작 신호 */
    .pulse { animation: pulse 13s ease-out infinite; transform-origin: center; }
    @keyframes pulse {
      0%       { opacity: 0;   r: 5; }
      4%       { opacity: .55; r: 5; }
      14%      { opacity: 0;   r: 20; }
      100%     { opacity: 0;   r: 20; }
    }
    /* 흐르는 진행선 */
    .flow { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 7; animation: flow 13s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -288; } }

    @media (prefers-reduced-motion: reduce) {
      .pop  { opacity: 1; animation: none; }
      .pulse { opacity: 0; animation: none; }
      .flow { animation: none; }
    }
  </style>

  <rect class="bg" width="880" height="476" rx="10"/>

  <text class="h1" x="36" y="40">로드 시점으로 레이어를 나눈다</text>
  <text class="sub" x="36" y="63">매 세션 로드되는 분량을 줄이는 것이 이 저장소의 설계 원칙이다. 규칙을 어디에 두느냐가 효과를 결정한다.</text>

  <!-- 진행선 -->
  <line class="flow" x1="36" y1="88" x2="844" y2="88"/>

  <!-- ───────── 1. 매 세션 전부 ───────── -->
  <g>
    <rect class="card" x="36" y="104" width="258" height="36" rx="7"/>
    <rect x="36" y="104" width="4" height="36" rx="2" fill="var(--always)"/>
    <circle class="pulse" cx="56" cy="122" r="5" fill="var(--always)"/>
    <text class="colh" x="70" y="120" fill="var(--always)">① 매 세션 전부</text>
    <text class="colm" x="70" y="134">세션이 열리는 순간 컨텍스트에 올라간다</text>
  </g>
  <g class="pop" style="animation-delay:.1s">
    <rect class="card" x="36" y="150" width="258" height="38" rx="7"/>
    <text class="item" x="50" y="167">CLAUDE.md</text>
    <text class="meta" x="50" y="181">항상 참인 규칙 13개 · 40줄</text>
  </g>
  <g class="pop" style="animation-delay:.35s">
    <rect class="card" x="36" y="194" width="258" height="38" rx="7"/>
    <text class="item" x="50" y="211">agent <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">description</tspan></text>
    <text class="meta" x="50" y="225">16개 합계 3,547자 — 고를 수 있을 만큼만</text>
  </g>
  <g class="pop" style="animation-delay:.6s">
    <rect class="card" x="36" y="238" width="258" height="38" rx="7"/>
    <text class="item" x="50" y="255">rules/</text>
    <text class="meta" x="50" y="269">한국어 통제 언어 8규칙</text>
  </g>
  <g class="pop" style="animation-delay:.85s">
    <rect class="card" x="36" y="282" width="258" height="38" rx="7"/>
    <text class="item" x="50" y="299">memory/</text>
    <text class="meta" x="50" y="313">되돌아간 적 있는 판단 19개 + 인덱스</text>
  </g>
  <g class="pop" style="animation-delay:1.1s">
    <rect class="card" x="36" y="326" width="258" height="38" rx="7"/>
    <text class="item" x="50" y="343">MCP</text>
    <text class="meta" x="50" y="357">도구 이름만. 본문은 호출할 때</text>
  </g>

  <!-- ───────── 2. 부를 때만 ───────── -->
  <g>
    <rect class="card" x="311" y="104" width="258" height="36" rx="7"/>
    <rect x="311" y="104" width="4" height="36" rx="2" fill="var(--ondemand)"/>
    <text class="colh" x="327" y="120" fill="var(--ondemand)">② 이름을 부를 때만</text>
    <text class="colm" x="327" y="134">설명이 작업과 맞을 때도 열린다</text>
  </g>
  <g class="pop" style="animation-delay:2.2s">
    <rect class="card" x="311" y="150" width="258" height="32" rx="7"/>
    <text class="item" x="325" y="170">/verify</text>
    <text class="meta" x="395" y="170">검증 게이트</text>
  </g>
  <g class="pop" style="animation-delay:2.4s">
    <rect class="card" x="311" y="188" width="258" height="32" rx="7"/>
    <text class="item" x="325" y="208">/html-doc</text>
    <text class="meta" x="406" y="208">기술 메모 포맷</text>
  </g>
  <g class="pop" style="animation-delay:2.6s">
    <rect class="card" x="311" y="226" width="258" height="32" rx="7"/>
    <text class="item" x="325" y="246">/blog-post</text>
    <text class="meta" x="406" y="246">블로그 · 카페</text>
  </g>
  <g class="pop" style="animation-delay:2.8s">
    <rect class="card" x="311" y="264" width="258" height="32" rx="7"/>
    <text class="item" x="325" y="284">/build-service</text>
    <rect class="chip" x="486" y="272" width="68" height="17" rx="8"/>
    <text class="chipt" x="494" y="284">사용자만</text>
  </g>
  <g class="pop" style="animation-delay:3s">
    <rect class="card" x="311" y="302" width="258" height="32" rx="7"/>
    <text class="item" x="325" y="322">/distill</text>
    <rect class="chip" x="486" y="310" width="68" height="17" rx="8"/>
    <text class="chipt" x="494" y="322">사용자만</text>
  </g>
  <g class="pop" style="animation-delay:3.2s">
    <rect class="card" x="311" y="340" width="258" height="32" rx="7"/>
    <text class="item" x="325" y="360">/sync-knowledge</text>
    <rect class="chip" x="486" y="348" width="68" height="17" rx="8"/>
    <text class="chipt" x="494" y="360">사용자만</text>
  </g>
  <g class="pop" style="animation-delay:3.4s">
    <text class="meta" x="325" y="390" fill="var(--warn)">사용자만 = 쓰기 side-effect 가 커서 자동 호출을 막았다</text>
  </g>

  <!-- ───────── 3. 그 에이전트가 돌 때만 ───────── -->
  <g>
    <rect class="card" x="586" y="104" width="258" height="36" rx="7"/>
    <rect x="586" y="104" width="4" height="36" rx="2" fill="var(--lazy)"/>
    <text class="colh" x="602" y="120" fill="var(--lazy)">③ 그 에이전트가 돌 때만</text>
    <text class="colm" x="602" y="134">메인 대화 컨텍스트를 먹지 않는다</text>
  </g>
  <g class="pop" style="animation-delay:4.4s">
    <rect class="card" x="586" y="150" width="258" height="70" rx="7"/>
    <text class="item" x="600" y="172">agent 본문 16개</text>
    <text class="meta" x="600" y="190">방법론 · 체크리스트 · 산출물 포맷</text>
    <text class="meta" x="600" y="206">장기 기억 경로 · MCP 도구 사용법</text>
  </g>
  <g class="pop" style="animation-delay:4.7s">
    <rect class="card" x="586" y="228" width="258" height="56" rx="7"/>
    <text class="item" x="600" y="250">skills/*/references/</text>
    <text class="meta" x="600" y="268">blog-post 의 참조 5개 — 필요한 것만</text>
  </g>
  <g class="pop" style="animation-delay:5s">
    <rect class="card" x="586" y="292" width="258" height="56" rx="7"/>
    <text class="item" x="600" y="314">hooks/</text>
    <text class="meta" x="600" y="332">이벤트가 일어날 때. 지시문이 아니라 강제</text>
  </g>

  <!-- 캡션 -->
  <line x1="36" y1="416" x2="844" y2="416" stroke="var(--line)" stroke-width="1"/>
  <g class="pop" style="animation-delay:5.6s">
    <text class="cap" x="36" y="440"><tspan class="capb">①을 줄이면 ②③이 산다.</tspan> agent description 8개를 5,354자에서 1,944자로 줄인 것이 이 원칙의 적용이다 —</text>
    <text class="cap" x="36" y="459">지운 내용은 전부 ③의 본문에 이미 있던 중복이라 정보를 잃지 않았다.</text>
  </g>
</svg>
